<svg xmlns="http://www.w3.org/2000/svg" width="738" height="1600" viewBox="0 0 390 844"><title>Una cuenta, tus dos roles — datos ficticios</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="390" height="844" rx="0" fill="#f4f7fc" stroke="none"/><rect x="0" y="0" width="390" height="83" rx="0" fill="#fff" stroke="none"/><text x="22" y="28" font-size="12" fill="#17202e" font-weight="600">12:14</text><text x="316" y="28" font-size="11" fill="#687383" font-weight="400">▰  100%</text><text x="22" y="65" font-size="26" fill="#17202e" font-weight="400">☰</text><text x="74" y="63" font-size="21" fill="#2460ed" font-weight="700">♧ A ⇄</text><text x="244" y="64" font-size="27" fill="#2460ed" font-weight="400">☾</text><text x="292" y="62" font-size="26" fill="#2460ed" font-weight="400">◎</text><text x="339" y="62" font-size="26" fill="#2460ed" font-weight="400">☏</text><text x="20" y="126" font-size="31" fill="#17202e" font-weight="800">Cómo uso RunCircuit</text><text x="20" y="153" font-size="14" fill="#687383" font-weight="400">Una cuenta, tus dos roles</text><rect x="20" y="178" width="350" height="340" rx="18" fill="#fff" stroke="#e1e6ed"/><text x="38" y="212" font-size="17" fill="#17202e" font-weight="700">Quiero usar RunCircuit como</text><rect x="38" y="235" width="135" height="38" rx="12" fill="#fff" stroke="none"/><text x="50" y="260" font-size="13" fill="#687383" font-weight="600">Corredor</text><rect x="185" y="235" width="145" height="38" rx="12" fill="#fff" stroke="none"/><text x="197" y="260" font-size="13" fill="#687383" font-weight="600">Entrenador</text><rect x="38" y="287" width="112" height="38" rx="12" fill="#2460ed" stroke="none"/><text x="50" y="312" font-size="13" fill="#fff" font-weight="600">Ambos</text><text x="38" y="357" font-size="16" fill="#17202e" font-weight="400">Tu entrenamiento personal y tu panel</text><text x="38" y="383" font-size="16" fill="#17202e" font-weight="400">de alumnos, con la misma cuenta.</text><text x="38" y="427" font-size="13" fill="#687383" font-weight="400">Conservás actividades, planes y vínculos</text><text x="38" y="449" font-size="13" fill="#687383" font-weight="400">al cambiar tu elección.</text><rect x="38" y="466" width="314" height="38" rx="12" fill="#2460ed" stroke="none"/><text x="50" y="491" font-size="13" fill="#fff" font-weight="600">Guardar elección</text><rect x="20" y="542" width="350" height="105" rx="18" fill="#fff" stroke="#e1e6ed"/><text x="38" y="571" font-size="19" fill="#17202e" font-weight="700">Acceso de entrenador</text><text x="38" y="597" font-size="14" fill="#687383" font-weight="400">El acceso requiere habilitación.</text><text x="38" y="624" font-size="14" fill="#2460ed" font-weight="600">Organizá las semanas de tus alumnos.</text><rect x="20" y="661" width="350" height="105" rx="18" fill="#fff" stroke="#e1e6ed"/><text x="38" y="690" font-size="19" fill="#17202e" font-weight="700">También sos corredor</text><text x="38" y="716" font-size="14" fill="#687383" font-weight="400">Tu progreso personal siempre a mano.</text><text x="38" y="743" font-size="14" fill="#2460ed" font-weight="600">Planificá · registrá · compartí</text><rect x="0" y="772" width="390" height="72" rx="0" fill="#fff" stroke="none"/><text x="29" y="800" font-size="23" fill="#2460ed" font-weight="700">⌂</text><text x="10" y="823" font-size="11" fill="#2460ed" font-weight="700">Inicio</text><text x="107" y="800" font-size="23" fill="#687383" font-weight="700">▦</text><text x="88" y="823" font-size="11" fill="#687383" font-weight="400">Mi semana</text><text x="185" y="800" font-size="23" fill="#687383" font-weight="700">⚑</text><text x="166" y="823" font-size="11" fill="#687383" font-weight="400">Carreras</text><text x="263" y="800" font-size="23" fill="#687383" font-weight="700">♜</text><text x="244" y="823" font-size="11" fill="#687383" font-weight="400">Ranking</text><text x="341" y="800" font-size="23" fill="#687383" font-weight="700">♧</text><text x="322" y="823" font-size="9.35672514619883" fill="#687383" font-weight="400">Comunidad</text></g></svg>